    <text x="36" y="173" fill="#94A3B8" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">scope:    "ninja-c9/mintrun"</text>
    <text x="36" y="190" fill="#E2E8F0" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">cmd:      ["gh","pr","create"]</text>

