    <text x="193" y="18" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" text-anchor="middle">ZERO-KNOWLEDGE CREDENTIAL ENCLAVE</text>
