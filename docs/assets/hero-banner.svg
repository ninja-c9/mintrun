    <text x="36" y="156" fill="#94A3B8" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">repo:  ninja-c9/mintrun</text>
    <text x="36" y="173" fill="#94A3B8" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">perms: contents:write, pr:write</text>
    <text x="36" y="190" fill="#FBBF24" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">exit:  DELETE /installation/token</text>

    <rect x="22" y="228" width="252" height="36" rx="10" fill="#0B211D" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
