      <stop offset="50%" stop-color="#0B0D13"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>
    <radialGradient id="enclaveGlow" cx="50%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#0EA5E9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161821" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0C0E14" stop-opacity="0.94"/>
