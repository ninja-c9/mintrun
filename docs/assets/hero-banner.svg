  <text x="600" y="144" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2" text-anchor="middle">Your vault keeps the master key. Your AI agent borrows a scoped lease.</text>

