<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080A"/>
      <stop offset="50%" stop-color="#0D1017"/>
      <stop offset="100%" stop-color="#090D12"/>
    </linearGradient>
    <radialGradient id="mintGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181C24" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0F1218" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="enclaveSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112220" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0C151C" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="mintAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" rx="28" fill="url(#bgGrad)"/>
  <rect width="1200" height="540" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="540" rx="28" fill="url(#mintGlow)"/>
  <rect x="1" y="1" width="1198" height="538" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Top Header Pill -->
  <g transform="translate(425, 34)">
    <rect width="350" height="30" rx="15" fill="#131922" stroke="#34D399" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="18" cy="15" r="4.5" fill="#34D399"/>
    <text x="184" y="19.5" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" text-anchor="middle">ZERO-KNOWLEDGE AGENT ENCLAVE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="114" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="48" font-weight="800" letter-spacing="-1.2" text-anchor="middle">mintrun</text>
  <text x="600" y="148" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="18.5" font-weight="400" letter-spacing="-0.2" text-anchor="middle">Give AI agents the authority to deploy. Never the raw credentials.</text>

  <!-- LEFT CARD: AI Agent Harness (Untrusted Context) -->
  <g transform="translate(56, 192)" filter="url(#softShadow)">
    <rect width="290" height="276" rx="20" fill="url(#cardSurface)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2"/>
    <rect x="20" y="20" width="118" height="24" rx="12" fill="#1E293B"/>
    <text x="79" y="36" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.8" text-anchor="middle">AGENT CONTEXT</text>

    <text x="22" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700">AI Coding Agents</text>
    <text x="22" y="94" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">Antigravity · Claude Code · Cursor</text>

    <!-- Agent Prompt Box -->
    <rect x="20" y="114" width="250" height="86" rx="12" fill="#090B10" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="34" y="136" fill="#38BDF8" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11.5" font-weight="600">&gt; tools/call: mintrun_exec</text>
    <text x="34" y="156" fill="#94A3B8" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">provider: "cloudflare"</text>
    <text x="34" y="173" fill="#94A3B8" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">scope:    "example.com"</text>
    <text x="34" y="190" fill="#E2E8F0" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">cmd:      ["wrangler","deploy"]</text>

    <!-- Guarantee badge -->
    <rect x="20" y="218" width="250" height="36" rx="10" fill="#141B26" stroke="#334155" stroke-width="1"/>
    <circle cx="38" cy="236" r="5" fill="#F43F5E"/>
    <text x="52" y="240" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500">0 Raw Secrets in LLM Context</text>
  </g>

  <!-- Connector 1: Agent -> Enclave -->
  <g transform="translate(346, 305)">
    <line x1="8" y1="20" x2="78" y2="20" stroke="url(#mintAccent)" stroke-width="2.2" stroke-dasharray="5,4"/>
    <polygon points="78,15 88,20 78,25" fill="#34D399"/>
    <text x="46" y="10" fill="#34D399" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" text-anchor="middle">MCP stdio</text>
    <text x="46" y="38" fill="#64748B" font-family="'SF Mono', Menlo, monospace" font-size="9.5" text-anchor="middle">Redacted Out</text>
  </g>

  <!-- CENTER CARD: mintrun Enclave -->
  <g transform="translate(438, 178)" filter="url(#softShadow)">
    <rect width="324" height="304" rx="22" fill="url(#enclaveSurface)" stroke="url(#borderGlow)" stroke-width="1.8"/>

    <!-- Enclave Header -->
    <rect x="22" y="20" width="136" height="24" rx="12" fill="#064E3B"/>
    <circle cx="36" cy="32" r="4" fill="#34D399"/>
    <text x="95" y="36" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">MINTRUN RUNTIME</text>

    <text x="22" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="21" font-weight="700">Blind Execution Core</text>
    <text x="22" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">100% Go Stdlib · Everything is a Plugin</text>

    <!-- 3 Internal Pillars -->
    <rect x="22" y="110" width="280" height="50" rx="11" fill="#0A1216" stroke="#34D399" stroke-opacity="0.28"/>
    <text x="38" y="132" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" font-weight="700">1. Vault Plugin (macOS Keychain)</text>
    <text x="38" y="149" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5">Unlocks Master Secret in host memory only</text>

    <rect x="22" y="170" width="280" height="50" rx="11" fill="#0A1216" stroke="#38BDF8" stroke-opacity="0.28"/>
    <text x="38" y="192" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" font-weight="700">2. Provider Plugin (JIT Minter)</text>
    <text x="38" y="209" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5">Mints zone-scoped sub-token (TTL 600s)</text>

    <rect x="22" y="230" width="280" height="52" rx="11" fill="#0A1216" stroke="#A78BFA" stroke-opacity="0.28"/>
    <text x="38" y="252" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5" font-weight="700">3. Stream Scrubber &amp; Auto-Revoke</text>
    <text x="38" y="269" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5">Redacts stdout/stderr &amp; revokes lease on exit</text>
  </g>

  <!-- Connector 2: Enclave -> Cloud APIs -->
  <g transform="translate(762, 305)">
    <line x1="8" y1="20" x2="78" y2="20" stroke="url(#mintAccent)" stroke-width="2.2" stroke-dasharray="5,4"/>
    <polygon points="78,15 88,20 78,25" fill="#06B6D4"/>
    <text x="46" y="10" fill="#38BDF8" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" text-anchor="middle">JIT Lease</text>
    <text x="46" y="38" fill="#64748B" font-family="'SF Mono', Menlo, monospace" font-size="9.5" text-anchor="middle">Auto-DELETE</text>
  </g>

  <!-- RIGHT CARD: Scoped Cloud Target -->
  <g transform="translate(854, 192)" filter="url(#softShadow)">
    <rect width="290" height="276" rx="20" fill="url(#cardSurface)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2"/>
    <rect x="20" y="20" width="132" height="24" rx="12" fill="#1E293B"/>
    <text x="86" y="36" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.8" text-anchor="middle">EPHEMERAL TARGET</text>

    <text x="22" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700">Scoped Cloud CLI</text>
    <text x="22" y="94" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">Cloudflare · GitHub · AWS · Terraform</text>

    <!-- Lease Metadata Box -->
    <rect x="20" y="114" width="250" height="86" rx="12" fill="#090B10" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="34" y="136" fill="#34D399" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11.5" font-weight="600">POST /client/v4/user/tokens</text>
    <text x="34" y="156" fill="#94A3B8" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">zone:  com.cloudflare.zone.023e</text>
    <text x="34" y="173" fill="#94A3B8" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">perms: dns:write, workers:write</text>
    <text x="34" y="190" fill="#FBBF24" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11">exit:  DELETE /user/tokens/{id}</text>

    <!-- Revoke badge -->
    <rect x="20" y="218" width="250" height="36" rx="10" fill="#0B211D" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="38" cy="236" r="5" fill="#34D399"/>
    <text x="52" y="240" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500">Token Destroyed on Process Exit</text>
  </g>
</svg>
