<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070A"/>
      <stop offset="100%" stop-color="#0C1018"/>
    </linearGradient>
    <linearGradient id="stepCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151923"/>
      <stop offset="100%" stop-color="#0D1017"/>
    </linearGradient>
    <linearGradient id="lineAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#pipeBg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>

  <text x="48" y="46" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">EXECUTION LIFECYCLE</text>
  <text x="48" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="700">Five Stages. Milliseconds from Request to Revocation.</text>

  <!-- Connecting Line -->
  <line x1="140" y1="185" x2="1060" y2="185" stroke="url(#lineAccent)" stroke-width="2.2" stroke-dasharray="6,5"/>

  <!-- Step 1 -->
  <g transform="translate(44, 104)">
    <rect width="204" height="176" rx="18" fill="url(#stepCard)" stroke="#34D399" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="14" fill="#064E3B"/>
    <text x="32" y="36.5" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">01</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700">Policy Gate</text>
    <text x="20" y="96" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">Verifies allowed scopes,</text>
    <text x="20" y="114" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">permissions, max TTL, and</text>
    <text x="20" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">blocks env-dumping.</text>
    <text x="20" y="158" fill="#34D399" font-family="'SF Mono', Menlo, monospace" font-size="10.5">Runtime.CheckPolicy()</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(271, 104)">
    <rect width="204" height="176" rx="18" fill="url(#stepCard)" stroke="#34D399" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="14" fill="#064E3B"/>
    <text x="32" y="36.5" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">02</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700">Vault Unlock</text>
    <text x="20" y="96" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">Loads Master Secret from</text>
    <text x="20" y="114" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">Keychain, libsecret, or</text>
    <text x="20" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">1Password into host RAM.</text>
    <text x="20" y="158" fill="#34D399" font-family="'SF Mono', Menlo, monospace" font-size="10.5">Vault.GetSecret()</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(498, 104)">
    <rect width="204" height="176" rx="18" fill="url(#stepCard)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="14" fill="#0C4A6E"/>
    <text x="32" y="36.5" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">03</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700">Scoped JIT Mint</text>
    <text x="20" y="96" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">Issues a short-lived token</text>
    <text x="20" y="114" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">locked to one zone, repo,</text>
    <text x="20" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">role ARN, or OAuth scope.</text>
    <text x="20" y="158" fill="#38BDF8" font-family="'SF Mono', Menlo, monospace" font-size="10.5">Provider.Mint()</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(725, 104)">
    <rect width="204" height="176" rx="18" fill="url(#stepCard)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="14" fill="#0C4A6E"/>
    <text x="32" y="36.5" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">04</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700">Blind Exec &amp; Scrub</text>
    <text x="20" y="96" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">Runs native CLI in its own</text>
    <text x="20" y="114" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">process group and scrubs</text>
    <text x="20" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">5 secret encodings.</text>
    <text x="20" y="158" fill="#38BDF8" font-family="'SF Mono', Menlo, monospace" font-size="10.5">[MINTRUN:REDACTED]</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(952, 104)">
    <rect width="204" height="176" rx="18" fill="url(#stepCard)" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="14" fill="#3B0764"/>
    <text x="32" y="36.5" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">05</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700">Revoke &amp; Audit</text>
    <text x="20" y="96" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">Deletes sub-token on exit</text>
    <text x="20" y="114" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">(CF/GH) or tracks expiry,</text>
    <text x="20" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">and writes audit.jsonl.</text>
    <text x="20" y="158" fill="#C4B5FD" font-family="'SF Mono', Menlo, monospace" font-size="10.5">Provider.Revoke()</text>
  </g>
</svg>
