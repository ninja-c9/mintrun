<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F"/>
      <stop offset="100%" stop-color="#0D111A"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151923"/>
      <stop offset="100%" stop-color="#0E1219"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="26" fill="url(#bentoBg)"/>
  <rect x="1" y="1" width="1198" height="458" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <text x="44" y="46" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">MODULAR ARCHITECTURE</text>
  <text x="44" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="700">Everything is a Plugin. Zero External Dependencies.</text>

  <!-- Row 1: 3 Core Plugin Contracts -->
  <!-- Vault Plugin Tile -->
  <g transform="translate(44, 98)">
    <rect width="356" height="162" rx="18" fill="url(#tileGrad)" stroke="#34D399" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="22" y="20" width="84" height="22" rx="11" fill="#064E3B"/>
    <text x="64" y="35" fill="#6EE7B7" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" text-anchor="middle">kind: vault</text>
    <text x="22" y="68" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">VaultPlugin</text>
    <text x="22" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">Custodies long-lived Master Secrets outside AI</text>
    <text x="22" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">context using hardware-backed OS keychains.</text>
    <text x="22" y="140" fill="#34D399" font-family="'SF Mono', Menlo, monospace" font-size="11">Built-in: macOS Keychain + 0600 Fallback</text>
  </g>

  <!-- Provider Plugin Tile -->
  <g transform="translate(422, 98)">
    <rect width="356" height="162" rx="18" fill="url(#tileGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="22" y="20" width="106" height="22" rx="11" fill="#0C4A6E"/>
    <text x="75" y="35" fill="#7DD3FC" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" text-anchor="middle">kind: provider</text>
    <text x="22" y="68" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">ProviderPlugin</text>
    <text x="22" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">Translates human scopes (e.g. domain name)</text>
    <text x="22" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">into short-lived, auto-revoked sub-tokens.</text>
    <text x="22" y="140" fill="#38BDF8" font-family="'SF Mono', Menlo, monospace" font-size="11">Built-in: Cloudflare JIT Sub-Token API</text>
  </g>

  <!-- Bridge Plugin Tile -->
  <g transform="translate(800, 98)">
    <rect width="356" height="162" rx="18" fill="url(#tileGrad)" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="22" y="20" width="94" height="22" rx="11" fill="#3B0764"/>
    <text x="69" y="35" fill="#DDD6FE" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" text-anchor="middle">kind: bridge</text>
    <text x="22" y="68" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">BridgePlugin</text>
    <text x="22" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">Exposes blind execution tools to AI agent</text>
    <text x="22" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">harnesses over standardized RPC transports.</text>
    <text x="22" y="140" fill="#C4B5FD" font-family="'SF Mono', Menlo, monospace" font-size="11">Built-in: MCP JSON-RPC 2.0 (stdio)</text>
  </g>

  <!-- Row 2: 2 Wide Bento Tiles -->
  <!-- Polyglot JSON-over-stdio SDK -->
  <g transform="translate(44, 280)">
    <rect width="545" height="142" rx="18" fill="url(#tileGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2"/>
    <text x="24" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="17" font-weight="700">Polyglot Out-of-Process Plugin SDK</text>
    <text x="24" y="62" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">Install community or custom plugins into ~/.mintrun/plugins/ from local</text>
    <text x="24" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">directories or HTTPS bundles. Any executable speaking JSON over stdio works.</text>
    <rect x="24" y="96" width="496" height="30" rx="8" fill="#090B10"/>
    <text x="38" y="115" fill="#6EE7B7" font-family="'SF Mono', Menlo, monospace" font-size="11">$ mintrun plugin install https://registry.example.com/plugins/github.json</text>
  </g>

  <!-- Defense-in-Depth Guardrails -->
  <g transform="translate(611, 280)">
    <rect width="545" height="142" rx="18" fill="url(#tileGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2"/>
    <text x="24" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="17" font-weight="700">Pure Go Stdlib · Auditable in 10 Minutes</text>
    <text x="24" y="62" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">Security tools shouldn't pull 200 transitive dependencies. mintrun compiles</text>
    <text x="24" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12.5">into a single static binary using 100% Go standard library packages.</text>
    <rect x="24" y="96" width="496" height="30" rx="8" fill="#090B10"/>
    <text x="38" y="115" fill="#7DD3FC" font-family="'SF Mono', Menlo, monospace" font-size="11">0 external modules in go.mod  ·  &lt;1,500 LOC  ·  100% deterministic tests</text>
  </g>
</svg>
