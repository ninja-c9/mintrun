<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>mintrun intro</title>
<style>html,body{margin:0;background:#090B10;display:grid;place-items:center;height:100vh}canvas{width:min(100vw,177.78vh);height:auto;max-height:100vh}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// mintrun: 36 s intro film. Everything is drawn in code; draw(frame) is a pure function of the frame number.
// Live preview: open this file and click once to start the soundtrack. Render: append ?render.
'use strict';
// ---------- core: format, math, look ----------
const W = 1920, H = 1080, FPS = 30, DUR = 36, FRAMES = FPS * DUR;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
let ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => clamp(t) * clamp(t);
const back = t => { t = clamp(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
function hash2(a, b) { let n = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263); n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967295; }
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Beat grid: 120 BPM, 1 beat = 0.5 s, 1 bar = 2 s. All choreography below is in beats (B = t / BEAT).
const BPM = 120, BEAT = 60 / BPM, b = n => n * BEAT;
const pr = (B, a, d = 1) => clamp((B - a) / d);          // 0 at beat a, 1 at beat a + d
const pop = (B, a, d = .5) => back(pr(B, a, d));         // overshooting scale-in
const pulse = (B, a, d = .5) => { const u = (B - a) / d; return u < 0 || u > 1 ? 0 : Math.sin(u * Math.PI); };

// Key beats, shared by the picture and EVENTS (the soundtrack).
const K = {
  q: 1, typ: 2, leak: 3, cp: [3.5, 4.5, 5.5], hit: [4, 5, 6], tags: [7, 8, 9],
  s2: 12, keyFly: 13, guides: 12.5, vault: 13.5, door: 15, stations: 15.5, title: 16, sub: 17, relief: 18, req: 19,
  s3: 20, bump: 21, shatter: 22, dArr: 22.5, chk: [23, 23.5, 24], open: 25, pass: 26,
  s4: 28, atVault: 29, unlock: 30, beam: 32, onward: 33, close: 34,
  s5: 36, plate: 36.5, stamp: 38, disp: 38.5, ttl: 39, lift: 40, slide: 41,
  s6: 44, inject: 45, frost: 45.5, cmd: 46, tokLine: 47.5, beamOut: 48, deployed: 49,
  s7: 52, exit: 53, burn: 54, scrub: 55, audit: 56, packet: 56.5, done5: 57,
  s8: 60, land: 61, chain: 61.5, tag1: 62, tag2: 63, cli: 64, chips: [66, 66.5, 67, 67.5]
};

const BG = '#090B10', MINT = '#34D399', MINT2 = '#10B981', MINT3 = '#6EE7B7', MINT4 = '#A7F3D0', MINTD = '#064E3B',
  SKY = '#38BDF8', SKY2 = '#7DD3FC', SKYD = '#0C4A6E', VIO = '#A78BFA', VIO2 = '#C4B5FD', VIOD = '#2E1065', AMB = '#FBBF24', AMB2 = '#FDE68A',
  ROSE = '#F43F5E', ROSE2 = '#FDA4AF', SL = '#94A3B8', SL2 = '#64748B', SL3 = '#334155', SL4 = '#1E293B', PANEL = '#0F172A', WHITE = '#F8FAFC', TXT = '#E2E8F0';
const RGB = { mint: '52,211,153', sky: '56,189,248', vio: '167,139,250', amb: '251,191,36', rose: '244,63,94' };
const SANS = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif', MONO = '"SF Mono", Menlo, monospace';
const font = (w, s, fam = SANS) => `${w} ${s}px ${fam}`;
const LOOK = { guideColor: 'rgba(110,231,183,.85)', wobble: 0 };

// Static ground: dark field, soft vignette, fine seeded grain. Rendered once.
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
(() => {
  const p = paper.getContext('2d'); p.fillStyle = BG; p.fillRect(0, 0, W, H);
  const g = p.createRadialGradient(W * .5, H * .42, 60, W * .5, H * .5, W * .72);
  g.addColorStop(0, 'rgba(22,52,50,.40)'); g.addColorStop(.55, 'rgba(10,18,22,.12)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  p.fillStyle = g; p.fillRect(0, 0, W, H);
  const r = rng(7);
  for (let i = 0; i < 14000; i++) { p.fillStyle = `rgba(${r() < .5 ? '255,255,255' : '0,0,0'},${(.02 + r() * .035).toFixed(3)})`; p.fillRect(r() * W, r() * H, 1.5, 1.5); }
})();

// ---------- camera + layout claims ----------
let PX = 1, CAM = { cx: 0, cy: 0, k: 1 };
function withCamera(cam, fn) { CAM = cam; ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.k, cam.k); ctx.translate(-cam.cx, -cam.cy); const px = PX; PX = 1 / cam.k; fn(); PX = px; ctx.restore(); }
const camLerp = (c0, c1, u) => ({ cx: lerp(c0.cx, c1.cx, u), cy: lerp(c0.cy, c1.cy, u), k: Math.exp(lerp(Math.log(c0.k), Math.log(c1.k), u)) });
const view = () => ({ x0: CAM.cx - W / 2 / CAM.k, x1: CAM.cx + W / 2 / CAM.k, y0: CAM.cy - H / 2 / CAM.k, y1: CAM.cy + H / 2 / CAM.k });

let LAYOUT = [];
function claim(id, kind, x, y, w, h) {
  if (ctx.globalAlpha < .05) return;
  const m = ctx.getTransform(), P = [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].map(([a, c]) => [m.a * a + m.c * c + m.e, m.b * a + m.d * c + m.f]);
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]), bx = Math.min(...xs), by = Math.min(...ys), bw = Math.max(...xs) - bx, bh = Math.max(...ys) - by;
  if (bx > W || by > H || bx + bw < 0 || by + bh < 0) return; // entirely off frame
  LAYOUT.push({ id, kind, x: bx, y: by, w: bw, h: bh });
}

// ---------- drawing helpers ----------
function glow(x, y, r, rgb, a) { if (a <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }
function rr(x, y, w, h, r, fill, stroke, lw = 2) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function alpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); fn(); ctx.restore(); }
function at(x, y, s, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); fn(); ctx.restore(); }

// Text, vertically centred on y. o.id claims the ink box for layout-check.
function text(s, x, y, o = {}) {
  ctx.save(); ctx.font = o.font || font(600, 32); ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'middle';
  if (o.alpha != null) ctx.globalAlpha *= clamp(o.alpha);
  ctx.fillStyle = o.col || TXT; ctx.fillText(s, x, y);
  const m = ctx.measureText(s);
  if (o.id) claim(o.id, 'text', x - m.actualBoundingBoxLeft - 2, y - m.actualBoundingBoxAscent - 2, m.actualBoundingBoxLeft + m.actualBoundingBoxRight + 4, m.actualBoundingBoxAscent + m.actualBoundingBoxDescent + 4);
  ctx.restore(); return m.width;
}
const tw = (s, f) => { ctx.save(); ctx.font = f; const w = ctx.measureText(s).width; ctx.restore(); return w; };
const chars = s => Array.from(s.normalize('NFC'));
const typed = (s, B, a, d) => { const c = chars(s); return c.slice(0, Math.floor(c.length * pr(B, a, d) + 1e-6)).join(''); };

// Partial polyline (for guides that draw on).
function polyTo(pts, u, closed = true) {
  const P = closed ? [...pts, pts[0]] : pts, seg = []; let L = 0;
  for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push(l); L += l; }
  let rem = L * clamp(u); ctx.beginPath(); ctx.moveTo(...P[0]);
  for (let i = 1; i < P.length && rem > 0; i++) { const f = Math.min(1, rem / seg[i - 1]); ctx.lineTo(lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)); rem -= seg[i - 1]; }
}
// Dashed construction guide: draws on over d beats from beat a, then fades.
function guideRect(x, y, w, h, B, a, d) {
  const u = pr(B, a, d), f = 1 - pr(B, a + d, .8); if (u <= 0 || f <= 0) return;
  ctx.save(); ctx.globalAlpha *= .85 * f; ctx.strokeStyle = LOOK.guideColor; ctx.lineWidth = 1.6 * PX; ctx.setLineDash([9 * PX, 7 * PX]);
  polyTo([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], u); ctx.stroke(); ctx.restore();
}

// Vector glyphs (no font dependency).
function icCheck(x, y, s, col, lw, u = 1) {
  if (u <= 0) return; ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const p = [[-.36, .02], [-.1, .28], [.38, -.3]].map(([a, c]) => [x + a * s, y + c * s]);
  const L = Math.hypot(p[1][0] - p[0][0], p[1][1] - p[0][1]) + Math.hypot(p[2][0] - p[1][0], p[2][1] - p[1][1]);
  ctx.setLineDash([L * clamp(u), L + 1]); ctx.beginPath(); ctx.moveTo(...p[0]); ctx.lineTo(...p[1]); ctx.lineTo(...p[2]); ctx.stroke(); ctx.restore();
}
function icCross(x, y, s, col, lw, u = 1) {
  if (u <= 0) return; ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; const h = s * .32, u1 = clamp(u * 2), u2 = clamp(u * 2 - 1);
  ctx.beginPath(); ctx.moveTo(x - h, y - h); ctx.lineTo(x - h + 2 * h * u1, y - h + 2 * h * u1);
  if (u2 > 0) { ctx.moveTo(x + h, y - h); ctx.lineTo(x + h - 2 * h * u2, y - h + 2 * h * u2); } ctx.stroke(); ctx.restore();
}
function icKey(x, y, s, col, lw = 7) { // bow centre at x,y, shaft pointing right
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.moveTo(15, 0); ctx.lineTo(62, 0); ctx.moveTo(48, 0); ctx.lineTo(48, 13); ctx.moveTo(59, 0); ctx.lineTo(59, 10); ctx.stroke(); ctx.restore();
}
function icEyeSlash(x, y, s, col, lw = 3) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-15, 0); ctx.quadraticCurveTo(0, -13, 15, 0); ctx.quadraticCurveTo(0, 13, -15, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-13, 12); ctx.lineTo(13, -12); ctx.stroke(); ctx.restore();
}
function icShield(x, y, s, fill, stroke) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(21, -17); ctx.lineTo(21, 1);
  ctx.quadraticCurveTo(19, 18, 0, 27); ctx.quadraticCurveTo(-19, 18, -21, 1); ctx.lineTo(-21, -17); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
}
function icArrow(x, y, s, col) { ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x - s / 2, y); ctx.lineTo(x + s / 2, y); ctx.moveTo(x + s / 2 - 7, y - 7); ctx.lineTo(x + s / 2, y); ctx.lineTo(x + s / 2 - 7, y + 7); ctx.stroke(); ctx.restore(); }
function dots(x, y, n, r, gap, col) { ctx.fillStyle = col; for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.arc(x + i * gap, y, r, 0, Math.PI * 2); ctx.fill(); } }

// Seeded particle burst (deterministic). Particles land on the floor (y 300), never below it.
function burst(B, a, x, y, o = {}) {
  const life = o.life || 1.6, u = (B - a) / life; if (u < 0 || u > 1) return;
  const dt = (B - a) * BEAT, n = o.n || 24, seed = o.seed || 1, ga = ctx.globalAlpha;
  ctx.save(); ctx.fillStyle = o.col || ROSE;
  for (let i = 0; i < n; i++) {
    const ang = (o.dir ?? -Math.PI / 2) + (hash2(i, seed) - .5) * (o.spread ?? Math.PI * 2), sp = (o.sp || 420) * (.35 + .65 * hash2(seed, i + 99));
    const sz = (o.size || 7) * (1 - .6 * u);
    const px = x + (hash2(i, seed + 5) - .5) * (o.w || 0) + Math.cos(ang) * sp * dt;
    const py = Math.min(300 - sz / 2, y + (hash2(i, seed + 9) - .5) * (o.h || 0) + Math.sin(ang) * sp * dt + (o.g ?? 1400) * dt * dt / 2);
    ctx.globalAlpha = ga * (1 - u) * (o.alpha ?? 1); ctx.fillRect(px - sz / 2, py - sz / 2, sz, sz);
  }
  ctx.restore();
}

// World backdrop: dot grid (above the floor only) and the floor.
function grid() {
  const v = view(), s = 80, r = 1.6 * PX; ctx.fillStyle = 'rgba(148,163,184,.10)';
  for (let x = Math.floor(v.x0 / s) * s; x <= v.x1; x += s) for (let y = Math.floor(v.y0 / s) * s; y < Math.min(v.y1, 300); y += s) ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function floorPlane() {
  const v = view(); if (v.y1 <= 300) return;
  const g = ctx.createLinearGradient(0, 300, 0, 300 + 360); g.addColorStop(0, 'rgba(18,30,38,.95)'); g.addColorStop(1, 'rgba(10,14,20,.6)');
  ctx.fillStyle = g; ctx.fillRect(v.x0, 300, v.x1 - v.x0, v.y1 - 300);
  ctx.fillStyle = 'rgba(52,211,153,.28)'; ctx.fillRect(v.x0, 300 - PX, v.x1 - v.x0, 2.2 * PX);
}

// ---------- the AI agent ----------
// robot(cx, cy, s, o): (cx, cy) = head centre in world units, s = scale, standing on the floor (world y 300).
// o = { mood: neutral|surprised|worried|relieved|happy, blink: 0..1, t: seconds, pop: 0..1 antenna flash }
const MOOD = { neutral: [SKY, RGB.sky], surprised: [AMB, RGB.amb], worried: [AMB, RGB.amb], relieved: [MINT, RGB.mint], happy: [MINT, RGB.mint] };
function robotBob(t) { return Math.sin(t * Math.PI) * 3; } // 2 s period
function robot(cx, cy, s, o) {
  const mood = o.mood || 'neutral', blink = o.blink || 0, t = o.t || 0, [mc, mrgb] = MOOD[mood];
  const bob = robotBob(t), shiver = mood === 'worried' ? Math.sin(t * 70) * 2.2 : 0, floorY = (300 - cy) / s;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  // foot on the floor, stem stretches with the bob
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, floorY, 110, 9, 0, 0, Math.PI * 2); ctx.fill();
  rr(-86, floorY - 18, 172, 18, 9, '#1B2533', SL3, 2);
  ctx.fillStyle = '#273244'; ctx.fillRect(-20, 270 + bob, 40, floorY - 18 - 270 - bob);
  ctx.translate(shiver, bob);
  // torso + neck
  ctx.fillStyle = '#94A3B8'; ctx.fillRect(-30, 86, 60, 30);
  rr(-150, 112, 300, 170, 60, '#CBD5E1');
  ctx.save(); ctx.beginPath(); ctx.roundRect(-150, 112, 300, 170, 60); ctx.clip(); ctx.fillStyle = 'rgba(71,85,105,.28)'; ctx.fillRect(70, 112, 90, 170); ctx.restore();
  rr(-62, 150, 124, 84, 22, '#0B1220');
  glow(0, 192, 70, mrgb, .35); ctx.fillStyle = mc; ctx.beginPath(); ctx.arc(0, 192, 15, 0, Math.PI * 2); ctx.fill();
  claim('robot-body', 'keep', -150, 86, 300, 196);
  // ears
  ctx.fillStyle = SL; for (const ex of [-130, 130]) { ctx.beginPath(); ctx.ellipse(ex, 0, 17, 42, 0, 0, Math.PI * 2); ctx.fill(); }
  // antenna
  ctx.strokeStyle = SL; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -144); ctx.stroke();
  const ab = 12 * (1 + .55 * (o.pop || 0));
  glow(0, -157, 60, mrgb, .55); ctx.fillStyle = mc; ctx.beginPath(); ctx.arc(0, -157, ab, 0, Math.PI * 2); ctx.fill();
  // head with a shaded right side
  rr(-120, -90, 240, 180, 48, '#E2E8F0');
  ctx.save(); ctx.beginPath(); ctx.roundRect(-120, -90, 240, 180, 48); ctx.clip(); ctx.fillStyle = 'rgba(71,85,105,.22)'; ctx.fillRect(66, -90, 60, 180); ctx.restore();
  claim('robot-head', 'keep', -147, -171, 294, 261);
  // visor + face
  rr(-95, -57, 190, 105, 36, '#0B1220');
  glow(0, -8, 110, RGB.sky, .10);
  ctx.save(); ctx.fillStyle = SKY; ctx.strokeStyle = SKY; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const eye = (x, w, h) => { const hh = Math.max(5, h * (1 - blink)); rr(x - w / 2, -12 - hh / 2, w, hh, w / 2, SKY); };
  if (mood === 'neutral') { eye(-42, 26, 44); eye(42, 26, 44); }
  if (mood === 'surprised') { eye(-42, 34, 58); eye(42, 34, 58); }
  if (mood === 'worried') {
    eye(-42, 26, 40); eye(42, 26, 40); ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-68, -40); ctx.lineTo(-28, -50); ctx.moveTo(68, -40); ctx.lineTo(28, -50); ctx.stroke();
  }
  if (mood === 'relieved') { ctx.lineWidth = 7; for (const x of [-42, 42]) { ctx.beginPath(); ctx.arc(x, -20, 17, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); } }
  if (mood === 'happy') { ctx.lineWidth = 8; for (const x of [-42, 42]) { ctx.beginPath(); ctx.arc(x, -2, 18, 1.12 * Math.PI, 1.88 * Math.PI); ctx.stroke(); } }
  ctx.lineWidth = 5; ctx.beginPath();
  if (mood === 'neutral') { ctx.moveTo(-16, 30); ctx.lineTo(16, 30); ctx.stroke(); }
  if (mood === 'surprised') { ctx.arc(0, 30, 8, 0, Math.PI * 2); ctx.stroke(); }
  if (mood === 'worried') { ctx.moveTo(-22, 32); for (let i = 1; i <= 4; i++) ctx.lineTo(-22 + i * 11, i % 2 ? 26 : 32); ctx.stroke(); }
  if (mood === 'relieved') { ctx.arc(0, 18, 16, .2 * Math.PI, .8 * Math.PI); ctx.stroke(); }
  if (mood === 'happy') { ctx.moveTo(-24, 22); ctx.arc(0, 22, 24, 0, Math.PI); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.restore();
  return bob;
}

// ---------- left side: the agent, its context, the leaks ----------
const ROBOT = { x: -2180, y: -60 }, PANEL_BOX = { x: -1960, y: -300, w: 480, h: 360 };
const LEAK_Y = [-280, -150, -20], LEAK_NAMES = ['stdout', 'transcript', 'log'];
const TAGS = ['token sống lâu', 'toàn quyền tài khoản', 'lộ qua stdout · transcript'], TAG_Y = [90, 148, 206];
const SECRET = 'CF_API_TOKEN=FAKE-Kx7f…9Qz', BLINKS = [.6, 10.5, 16.2, 20.5, 40, 62.5, 69];
const KEY_FROM = { x: -1930, y: -180, s: .55 }, KEY_HOME = { x: -603, y: 130, s: 1.4 }; // bow centre in the panel, then in the vault

function robotMood(B) { return B < K.leak ? 'neutral' : B < K.hit[0] ? 'surprised' : B < K.relief ? 'worried' : B < K.land ? 'relieved' : 'happy'; }

function leftWorld(B, t) {
  const bob = robotBob(t), P = PANEL_BOX;
  // hologram cone from the right ear to the panel
  ctx.save(); ctx.fillStyle = 'rgba(56,189,248,.06)'; ctx.strokeStyle = 'rgba(56,189,248,.20)'; ctx.lineWidth = 1.5 * PX;
  ctx.beginPath(); ctx.moveTo(ROBOT.x + 146, ROBOT.y + bob); ctx.lineTo(P.x, P.y + 10); ctx.lineTo(P.x, P.y + P.h - 10); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  const blink = Math.max(...BLINKS.map(x => pulse(B, x, .3)));
  robot(ROBOT.x, ROBOT.y, 1, { mood: robotMood(B), blink, t, pop: Math.max(pulse(B, K.leak, .6), pulse(B, K.relief, .6), pulse(B, K.land, .6)) });

  // context panel
  rr(P.x, P.y, P.w, P.h, 18, 'rgba(15,23,42,.9)', 'rgba(56,189,248,.55)', 2);
  ctx.fillStyle = 'rgba(56,189,248,.10)'; ctx.fillRect(P.x + 2, P.y + 44, P.w - 4, 1.5);
  claim('panel', 'keep', P.x, P.y, P.w, P.h);
  const M24 = font(500, 24, MONO), X0 = P.x + 22;
  text('agent context', X0, P.y + 23, { font: font(600, 20, MONO), col: SL2 });
  text('# .env', X0, -230, { font: M24, col: SL2 });
  // L2: the master key, held by the agent (until it flies into the vault)
  const gone = 1 - pr(B, 13, 3);
  alpha(gone, () => {
    if (B < K.keyFly) { glow(KEY_FROM.x, -180, 50, RGB.amb, .35); icKey(KEY_FROM.x, -180, KEY_FROM.s, AMB, 7); }
    const w = text(SECRET, X0 + 54, -180, { font: M24, col: AMB });
    strike(X0 + 54, -180, w, pr(B, 12, .8));
  });
  // L3: the command the agent runs

// ---------- score: written for this film. F major / D minor, 120 BPM (a bar = 2 s) ----------

window.SCORE = ac => {

  let seed = 7; const rnd = () => (seed = (Math.imul(seed, 1103515245) + 12345) & 0x7fffffff) / 2147483648;

  const filt = (type, f, q, dest) => { const n = ac.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; n.connect(dest); return n; };

  const sweep = (p, t, a, b, d) => { p.setValueAtTime(a, t); p.exponentialRampToValueAtTime(b, t + d); };

  // bus: music + sfx -> compressor -> master (fade at the end); the music bus drops out for the break

  const master = gain(ac.destination, .8); comp.connect(master);

  music.gain.setValueAtTime(1, at(58)); music.gain.linearRampToValueAtTime(0, at(58.4)); music.gain.setValueAtTime(1, at(60) - .01);

  const verb = ac.createConvolver(); verb.buffer = ir; verb.connect(gain(music, .25));
  const nbuf = ac.createBuffer(1, SR * 2, SR), nd = nbuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = rnd() * 2 - 1;

  // harmony: [bass, ...pad] and [beat, chord, beats]

    Fadd9: [41, 53, 57, 60, 67], Dm7: [50, 60, 62, 65, 69], C: [48, 55, 60, 64, 67], Csus4: [48, 55, 60, 65, 67], 'F/A': [45, 53, 57, 60, 65],
    Bbmaj7: [46, 58, 62, 65, 69], F: [41, 53, 57, 60, 65] };
  const PROG = [[0, 'Dm9', 4], [4, 'Bb', 2], [6, 'A7', 2], [8, 'Gm7', 2], [10, 'C7', 2], [12, 'Fadd9', 4], [16, 'Dm7', 2], [18, 'C', 2],
    [20, 'F', 4], [24, 'Bb', 2], [26, 'C', 2], [28, 'Dm9', 2], [30, 'Bb', 2], [32, 'Gm7', 2], [34, 'C', 2], [36, 'F', 4], [40, 'Dm7', 2],
    [42, 'Csus4', 1], [43, 'C', 1], [44, 'F/A', 2], [46, 'Bb', 2], [48, 'Bbmaj7', 2], [50, 'C', 2], [52, 'F', 4], [56, 'Gm7', 2],
    [60, 'Fadd9', 4], [64, 'Bbmaj7', 2], [66, 'C', 2], [68, 'Fadd9', 4]];

  const kickAt = B => B >= 8 && B < 68 && !brk(B) && (B % 2 === 0 || B >= 24);
  const hp = filt('highpass', 7000, .7, music), clapBP = filt('bandpass', 1500, 1.2, music); clapBP.connect(verb);
  for (let e = 0; e < 136; e++) {
    const B = e / 2, t = at(B); if (brk(B)) continue;
    const h = gain(hp); perc(h, t, e % 2 ? .09 : .05, .05); hiss(t, t + .08, h);
    if (e % 2) continue;
    if (kickAt(B)) { const v = gain(music); perc(v, t, .8 * (B < 16 ? .6 : B < 28 && B % 2 ? .5 : 1), .4); sweep(osc('sine', 150, t, t + .5, v).frequency, t, 150, 45, .25); }
    if (B >= 32 && B % 2) for (const [dt, p] of [[0, .6], [.012, .5], [.024, 1]]) { const v = gain(clapBP); perc(v, t + dt, p * (B < 36 ? .6 : 1), dt ? .2 : .03); hiss(t + dt, t + dt + .3, v); }
  }
  // pluck bass from b4: eighths, octave pattern, filter snaps shut; ducks under the kick
  for (const [b0, name, len] of PROG) if (b0 >= 4) for (let e = 0; e < len * 2; e++) {
    const B = b0 + e / 2, t = at(B), v = gain(music), lp = filt('lowpass', 1800, 4, v);
    perc(v, t, .3 * (Number.isInteger(B) && kickAt(B) ? .6 : 1), .22); sweep(lp.frequency, t, 1800, 300, .2);
    osc('sawtooth', mtof(CH[name][0] + [0, 0, 12, 0, 0, 12, 0, 12][(B * 2) % 8]), t, t + .3, lp);
  }
  // arp from b16: 16ths over the pad voicing an octave up, dotted-eighth echo
  const dly = ac.createDelay(1); dly.delayTime.value = .375; dly.connect(gain(dly, .3)); dly.connect(gain(music, .5));
  const arp = gain(music, 1); arp.connect(dly);
  for (const [b0, name, len] of PROG) if (b0 >= 16 && b0 < 68) {
    const v = CH[name].slice(1), n = v.length;
    for (let i = 0; i < len * 4; i++) { const B = b0 + i / 4, k = [0, 1, 2, 3, 2, 1, 2, 3][Math.round(B * 4) % 8], t = at(B), g = gain(arp);
      perc(g, t, .07, .14); osc('triangle', mtof(v[k % n] + 12 * Math.floor(k / n) + 12), t, t + .2, g); }
  }
  // FM bell (ratio 3.5, index decays)
  const bell = (t, m, pk = .1, d = 1.6, dest = sfx) => {
    const f = mtof(m), v = gain(dest); v.connect(verb); perc(v, t, pk, d);
    const car = osc('sine', f, t, t + d * 1.3, v), mg = gain(car.frequency); sweep(mg.gain, t, f * 2.5, f * .1, d * .6); osc('sine', f * 3.5, t, t + d * 1.3, mg);
  };
  [77, 84, 89].forEach((m, i) => bell(at(68 + i * .5), m, .09, 2.4, music)); // last bar: pad + bass + bells, then the fade

  // sound effects, one per visible action (EVENTS)
  const tone = (t, type, f0, f1, pk, d) => { const v = gain(sfx); perc(v, t, pk, d); const o = osc(type, f0, t, t + d * 1.5, v); if (f1 !== f0) sweep(o.frequency, t, f0, f1, d); return v; };
  const noiseHit = (t, type, f, q, pk, d) => { const v = gain(sfx); perc(v, t, pk, d); hiss(t, t + d * 1.5, filt(type, f, q, v)); };
  const swell = (t, d, pk, f0, f1, type = 'bandpass') => {
    const v = gain(sfx), fl = filt(type, f0, type === 'bandpass' ? 1.5 : .7, v);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(pk, t + d * .4); v.gain.linearRampToValueAtTime(0, t + d);
    sweep(fl.frequency, t, f0, f1, d); hiss(t, t + d, fl);
  };
  const FX = {
    type: (t, n = 6) => { for (let i = 0; i < n; i++) { const j = hash2(i, Math.round(t * 1e3)); noiseHit(t + i * .065 + j * .02, 'bandpass', 2000 + 2000 * j, 4, .5, .025); } },
    blip: (t, m) => tone(t, 'sine', mtof(m), mtof(m), .12, .3).connect(verb),
    leak: (t, lv = 1) => tone(t, 'triangle', 880, 330, .14 * lv, .32),
    whoosh: t => swell(t, .5, .22, 400, 3000),
    build: (t, tr = 0) => [77, 81, 84, 89].forEach((m, i) => tone(t + i * .125, 'triangle', mtof(m + tr), mtof(m + tr), .08, .25).connect(verb)),
    clunk: (t, lv = 1) => { tone(t, 'sine', 90, 50, .5 * lv, .25); noiseHit(t, 'lowpass', 600, .7, .3 * lv, .08); },
    title: (t, notes) => notes.forEach((m, i) => bell(t + i * .03, m, .08)),
    deny: t => {
      const v = gain(sfx); v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(.1, t + .02); v.gain.setValueAtTime(.1, t + .4); v.gain.linearRampToValueAtTime(0, t + .55);
      const trem = gain(v, .5), lp = filt('lowpass', 900, 1, trem); osc('square', 14, t, t + .6, gain(trem.gain, .5)); for (const f of [110, 116]) osc('sawtooth', f, t, t + .6, lp);
    },
    shatter: t => { tone(t, 'sine', 1400, 200, .15, .3); noiseHit(t, 'highpass', 3000, .7, .35, .25);
      for (let i = 0; i < 5; i++) { const j = hash2(i, 77), f = 2600 + 2400 * j; tone(t + .03 + i * .05 + j * .03, 'sine', f, f, .05, .15).connect(verb); } },
    tick: (t, a = 0) => tone(t, 'sine', mtof(96 + a), mtof(96 + a), .1, .09),
    gate: t => { swell(t - .25, .4, .12, 800, 3000); bell(t, 81, .1); },
    dial: t => { for (let i = 0; i < 8; i++) noiseHit(t + i * .062, 'bandpass', 3200, 3, .4, .02); },
    unlock: t => { for (const dt of [0, .09]) { noiseHit(t + dt, 'lowpass', 1500, 1, .35, .05); tone(t + dt, 'square', 220, 160, .05, .06); } },
    beam: t => { const v = gain(sfx); v.connect(verb); v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(.08, t + .3); v.gain.linearRampToValueAtTime(0, t + .8);
      sweep(osc('triangle', 300, t, t + .85, v).frequency, t, 300, 900, .6); },
    stamp: t => { tone(t, 'sine', 120, 40, .6, .3); noiseHit(t, 'lowpass', 1200, .7, .25, .1); bell(t + .02, 89, .07); },
    inject: t => { noiseHit(t, 'highpass', 2000, .7, .25, .015); tone(t, 'sine', 1200, 2400, .07, .15); },
    deploy: t => { bell(t, 84, .1); bell(t + .15, 89, .1); },
    burn: t => swell(t, .8, .16, 6000, 800, 'lowpass'),
    swish: t => swell(t, .4, .18, 1000, 6000),
    packet: t => { swell(t, .25, .15, 800, 3000); FX.blip(t + .1, 89); },
  };
  for (const [B, name, arg] of EVENTS) FX[name](at(B), arg);
  // the break: a soft riser (well under the mix) into the recap downbeat
  { const t0 = at(58), t1 = at(60), v = gain(sfx), fl = filt('bandpass', 300, 2, v);
    v.gain.setValueAtTime(0, t0); v.gain.linearRampToValueAtTime(.12, t1 - .04); v.gain.linearRampToValueAtTime(0, t1); sweep(fl.frequency, t0, 300, 2500, t1 - t0); hiss(t0, t1, fl); }
};

// ---------- exports + live preview (click once for sound) ----------
window.draw = draw; window.FRAMES = FRAMES; window.FPS = FPS; window.CUES = SHOTS.slice(1).map(s => s.from);
window.BPM = BPM; window.SHOTS = SHOTS; window.EVENTS = EVENTS; window.K = K;
draw(0);
if (!new URLSearchParams(location.search).has('render')) {
  let start = performance.now();
  const loop = () => { draw(Math.max(0, Math.floor((performance.now() - start) / 1000 * FPS)) % FRAMES); requestAnimationFrame(loop); };
  loop();
  addEventListener('click', () => { window.SCORE(new AudioContext()); start = performance.now() + 50; }, { once: true });
}
</script>
</body>
</html>
